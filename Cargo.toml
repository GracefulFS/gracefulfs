[package]
name = "gracefulfs"
version = "0.1.0"
edition = "2024"
description = "Windows filesystem analysis tool"
license = "MIT"
repository = "https://github.com/GracefulFS/gracefulfs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "core"
harness = false
